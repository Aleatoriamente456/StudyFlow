<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências - StudyFlow</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/styleMain.css">
    <script src="../script/storage.js" defer></script>
    <script src="../script/header.js" defer></script>
    <script src="../script/auth.js" defer></script>
    <script src="../script/preferencias.js" defer></script>
    <link rel="icon" type="image/png" href="../img/iconStudyFlow.png">
</head>
<body>

    <header class="header" id="appHeader"></header>

    <main class="main-content split-layout">

        <section class="left-column">
            <div class="main-text">
                <h1 id="heading">Definindo suas <br><span>preferências</span></h1>
                <p id="description">Em quais dias da semana você consegue estudar:</p>
            </div>
        </section>

        <section class="right-column">

            <div class="card" id="main-card">

                <div class="screen active">
                    <div class="days-grid">
                        <label class="option-pill"><input type="checkbox" name="dias" value="domingo"><span>Domingo</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="segunda"><span>Segunda</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="terca"><span>Terça</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="quarta"><span>Quarta</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="quinta"><span>Quinta</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="sexta"><span>Sexta</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="sabado"><span>Sábado</span></label>
                    </div>
                </div>

                <div class="screen">
                    <h3 class="card-subtitle">Seu horário de estudos</h3>
                    <div class="time-row">
                        <div class="time-group">
                            <label for="start">Horário de início</label>
                            <input id="start" type="time">
                        </div>
                        <span class="time-sep">até</span>
                        <div class="time-group">
                            <label for="end">Horário de término</label>
                            <input id="end" type="time">
                        </div>
                    </div>
                </div>

                <div class="screen">
                    <div class="subjects-grid" id="difficulty-grid"></div>
                </div>

                <div class="screen">
                    <div class="goal-presets-wrap">
                        <span class="goal-presets-label">Sugestões rápidas (clique para adicionar):</span>
                        <div class="goal-chips-list">
                            <button type="button" class="goal-chip" data-meta="Revisões com foco no ENEM">
                                Revisões com foco no ENEM
                            </button>
                            <button type="button" class="goal-chip" data-meta="Estudo para seminário">
                                Estudo para seminário
                            </button>
                            <button type="button" class="goal-chip" data-meta="Preparação para provas bimestrais">
                                Preparação para provas bimestrais
                            </button>
                            <button type="button" class="goal-chip" data-meta="Reforço nas matérias com maior dificuldade">
                                Reforço nas matérias com maior dificuldade
                            </button>
                            <button type="button" class="goal-chip" data-meta="Simulados e resolução de questões anteriores">
                                Simulados e questões anteriores
                            </button>
                            <button type="button" class="goal-chip" data-meta="Preparação para vestibulares (FUVEST / UNICAMP)">
                                Vestibulares (FUVEST / UNICAMP)
                            </button>
                        </div>
                    </div>
                    <div class="goals-divider"></div>
                    <textarea id="goals" placeholder="Ou escreva aqui suas metas personalizadas de estudo..."></textarea>
                </div>

            </div>

            <div class="actions-bar">
                <div class="nav-buttons">
                    <button class="button secondary" id="back" type="button" hidden>
                        ← Voltar
                    </button>
                    <button class="button primary" id="next" type="button">
                        Avançar →
                    </button>
                </div>
            </div>

        </section>

    </main>

    <footer class="footer">
        <div class="footer-logo">
            <img src="../img/LogoStudyFlow.png" alt="Logo do StudyFlow">
        </div>
    </footer>

</body>
</html>

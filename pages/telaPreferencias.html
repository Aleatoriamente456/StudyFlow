<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências - StudyFlow</title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/styleMain.css">
    <script src="../script/storage.js" defer></script>
    <script src="../script/header.js" defer></script>
    <script src="../script/auth.js" defer></script>
    <script src="../script/preferencias.js" defer></script>
</head>
<body>

    <header class="header" id="appHeader"></header>

    <main class="main-content split-layout">

        <!-- Coluna da Esquerda: Títulos -->
        <section class="left-column">
            <div class="main-text">
                <h1 id="heading">Definindo suas <br><span>preferências</span></h1>
                <p id="description">Em quais dias da semana você consegue estudar:</p>
            </div>
        </section>

        <!-- Coluna da Direita: Card das Etapas + Botões -->
        <section class="right-column">

            <div class="card" id="main-card">

                <!-- Etapa 1: Dias da semana -->
                <div class="screen active">
                    <div class="days-grid">
                        <label class="option-pill"><input type="checkbox" name="dias" value="domingo"><span>Domingo</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="segunda"><span>Segunda</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="terca"><span>Terça</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="quarta"><span>Quarta</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="quinta"><span>Quinta</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="sexta"><span>Sexta</span></label>
                        <label class="option-pill"><input type="checkbox" name="dias" value="sabado"><span>Sábado</span></label>
                    </div>
                </div>

                <!-- Etapa 2: Horário de estudos -->
                <div class="screen">
                    <h3 class="card-subtitle">Seu horário de estudos</h3>
                    <div class="time-row">
                        <div class="time-group">
                            <label for="start">Horário de início</label>
                            <input id="start" type="time">
                        </div>
                        <span class="time-sep">até</span>
                        <div class="time-group">
                            <label for="end">Horário de término</label>
                            <input id="end" type="time">
                        </div>
                    </div>
                </div>

                <!-- Etapa 3: Matérias com mais dificuldades -->
                <div class="screen">
                    <div class="subjects-grid" id="difficulty-grid"></div>
                </div>

                <!-- Etapa 4: Metas de estudo -->
                <div class="screen">
                    <textarea id="goals" placeholder="Digite aqui:"></textarea>
                </div>

                <!-- Etapa 5: Metodologia de estudos -->
                <div class="screen">
                    <h3 class="card-subtitle">Selecione uma <span>metodologia</span> de estudos</h3>
                    <div id="popup"></div>
                    <div class="methods-list">
                        <label class="option-pill method-pill" data-description="Leitura ativa em cinco etapas: Explorar, Questionar, Ler, Recitar e Revisar o conteúdo.">
                            <input type="radio" name="metodo" value="SQ3R">
                            <span>SQ3R</span>
                        </label>
                        <label class="option-pill method-pill" data-description="Consolide o aprendizado explicando o assunto em voz alta com palavras simples.">
                            <input type="radio" name="metodo" value="Feynman">
                            <span>Feynman</span>
                        </label>
                        <label class="option-pill method-pill" data-description="Ciclos de estudo focado de 25 minutos intercalados com pausas curtas de 5 minutos.">
                            <input type="radio" name="metodo" value="Pomodoro">
                            <span>Pomodoro</span>
                        </label>
                    </div>
                </div>

                <!-- Etapa 6: Matérias da rotina -->
                <div class="screen">
                    <div class="subjects-grid" id="subjects-grid"></div>
                </div>

                <!-- Etapa 7: Envio de materiais -->
                <div class="screen">
                    <input id="file-input" type="file" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg" multiple hidden>
                    <div class="files-list" id="files-list"></div>
                </div>

            </div>

            <!-- Barra de navegação inferior -->
            <div class="actions-bar">
                <button class="button secondary" id="add-files" type="button" hidden>
                    + Adicionar material
                </button>

                <div class="nav-buttons">
                    <button class="button secondary" id="back" type="button" hidden>
                        ← Voltar
                    </button>
                    <button class="button primary" id="next" type="button">
                        Avançar →
                    </button>
                </div>
            </div>

        </section>

    </main>

    <footer class="footer">
        <div class="footer-logo">
            <img src="../img/LogoStudyFlow.png" alt="Logo do StudyFlow">
        </div>
    </footer>

</body>
</html>

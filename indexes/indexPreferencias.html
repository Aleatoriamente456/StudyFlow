
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Preferências - StudyFlow</title>

    <link rel="stylesheet" href="stylePreferencias.css">
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="header">

        <div class="header-left">

            <button class="menu-button" aria-label="Menu">
                ☰
            </button>

            <img 
                src="LogoStudyFlow.png"
                alt="StudyFlow"
                class="brand-logo"
            >

        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="preferences-container">

        <!-- LADO ESQUERDO -->

        <section class="preferences-info">

            <h1>
                Definindo suas
                <span>preferências</span>
            </h1>

            <p id="step-description">
                Em quais dias da semana você
                consegue estudar:
            </p>

        </section>


        <!-- LADO DIREITO -->

        <section class="preferences-card">

            <!-- ETAPA 1: DIAS -->

            <div class="step active" id="step-1">

                <div class="days-grid">

                    <label class="option">
                        <input type="checkbox" name="dias" value="Domingo">
                        <span>Domingo</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="dias" value="Segunda">
                        <span>Segunda</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="dias" value="Terça">
                        <span>Terça</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="dias" value="Quarta">
                        <span>Quarta</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="dias" value="Quinta">
                        <span>Quinta</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="dias" value="Sexta">
                        <span>Sexta</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="dias" value="Sábado">
                        <span>Sábado</span>
                    </label>

                </div>

            </div>


            <!-- ETAPA 2: HORÁRIOS -->

            <div class="step" id="step-2">

                <h3 class="card-title">
                    Seu horário de estudos
                </h3>

                <div class="time-container">

                    <div class="time-field">

                        <label for="inicio">
                            Horário de início
                        </label>

                        <input
                            type="time"
                            id="inicio"
                            value="00:00"
                            required
                        >

                    </div>

                    <span class="time-separator">
                        até
                    </span>

                    <div class="time-field">

                        <label for="termino">
                            Horário de término
                        </label>

                        <input
                            type="time"
                            id="termino"
                            value="00:00"
                            required
                        >

                    </div>

                </div>

            </div>


            <!-- ETAPA 3: MATÉRIAS -->

            <div class="step" id="step-3">

                <div class="subjects-grid">

                    <label class="option">
                        <input type="checkbox" name="materias" value="Português">
                        <span>Português</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Física">
                        <span>Física</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Literatura">
                        <span>Literatura</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="História">
                        <span>História</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Ing/esp">
                        <span>Ing/esp</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Geografia">
                        <span>Geografia</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Artes">
                        <span>Artes</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Sociologia">
                        <span>Sociologia</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Matemática">
                        <span>Matemática</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Filosofia">
                        <span>Filosofia</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Biologia">
                        <span>Biologia</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Ed Física">
                        <span>Ed Física</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Química">
                        <span>Química</span>
                    </label>

                    <label class="option">
                        <input type="checkbox" name="materias" value="Redação">
                        <span>Redação</span>
                    </label>

                </div>

            </div>

        </section>


        <!-- BOTÕES DE NAVEGAÇÃO -->

        <div class="navigation-buttons">

            <button
                type="button"
                class="back-button"
                id="back-button"
                onclick="voltarEtapa()"
                aria-label="Voltar"
            >
                ←
            </button>

            <button
                type="button"
                class="next-button"
                id="next-button"
                onclick="avancarEtapa()"
                aria-label="Avançar"
            >
                →
            </button>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        let etapaAtual = 1;

        const descricoes = {

            1: "Em quais dias da semana você consegue estudar:",

            2: "Informe os horários em que pode começar e terminar seus estudos.",

            3: "Em quais matérias você tem mais dificuldades?"

        };


        // TROCAR DE ETAPA

        function mostrarEtapa(numero) {

            document.querySelectorAll(".step").forEach(etapa => {

                etapa.classList.remove("active");

            });

            document.getElementById("step-" + numero)
                .classList.add("active");

            document.getElementById("step-description")
                .textContent = descricoes[numero];

            // Mostrar botão voltar somente após a primeira etapa

            document.getElementById("back-button").style.display =
                numero === 1 ? "none" : "flex";

            // Alterar texto da última etapa

            document.getElementById("next-button").innerHTML =
                numero === 3 ? "✓" : "→";

            etapaAtual = numero;

        }


        // AVANÇAR

        function avancarEtapa() {

            // Verificar seleção dos dias

            if (etapaAtual === 1) {

                const dias = document.querySelectorAll(
                    'input[name="dias"]:checked'
                );

                if (dias.length === 0) {

                    alert("Selecione pelo menos um dia da semana!");

                    return;

                }

            }


            // Verificar horários

            if (etapaAtual === 2) {

                const inicio = document.getElementById("inicio").value;

                const termino = document.getElementById("termino").value;

                if (!inicio || !termino) {

                    alert("Informe os horários de estudo!");

                    return;

                }

                if (inicio >= termino) {

                    alert("O horário de término deve ser posterior ao início!");

                    return;

                }

            }


            // Verificar matérias

            if (etapaAtual === 3) {

                const materias = document.querySelectorAll(
                    'input[name="materias"]:checked'
                );

                if (materias.length === 0) {

                    alert("Selecione pelo menos uma matéria!");

                    return;

                }

                finalizarPreferencias();

                return;

            }


            mostrarEtapa(etapaAtual + 1);

        }


        // VOLTAR

        function voltarEtapa() {

            if (etapaAtual > 1) {

                mostrarEtapa(etapaAtual - 1);

            }

        }


        // FINALIZAR

        function finalizarPreferencias() {

            const dados = {

                dias: Array.from(
                    document.querySelectorAll(
                        'input[name="dias"]:checked'
                    )
                ).map(item => item.value),

                horarioInicio:
                    document.getElementById("inicio").value,

                horarioTermino:
                    document.getElementById("termino").value,

                materias: Array.from(
                    document.querySelectorAll(
                        'input[name="materias"]:checked'
                    )
                ).map(item => item.value)

            };

            console.log("Preferências do usuário:", dados);

            alert("Preferências preenchidas com sucesso!");

            // Posteriormente, podemos enviar esses dados
            // para o PHP e salvar no banco de dados.

        }


        // INICIAR NA PRIMEIRA ETAPA

        mostrarEtapa(1);

    </script>

</body>

</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <link rel="stylesheet" href="styleVisitante.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="header-left">
            <button class="menu-button" aria-label="Menu">
                ☰
            </button>

            <h2 class="logo-text">Study<span>Flow</span></h2>
        </div>

        <button class="profile-button" aria-label="Perfil">
            <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4"
                    stroke="white" stroke-width="1.7"/>
                <path d="M4.5 20C4.5 16.5 7.5 14 12 14
                    C16.5 14 19.5 16.5 19.5 20"
                    stroke="white" stroke-width="1.7"
                    stroke-linecap="round"/>
            </svg>
        </button>
    </header>

    <main class="main-content">

        <section class="welcome">
            <h1>Organize seus <span>estudos.</span></h1>
            <p>Evolua no seu ritmo!</p>
        </section>

    <!-- Card de boas vindas -->

        <section class="card">

            <div class="card-title">
                <div class="user-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="7" r="4"
                            stroke="#9135D4" stroke-width="2"/>
                        <rect x="5" y="13" width="14" height="8"
                            rx="4" stroke="#9135D4" stroke-width="2"/>
                    </svg>
                </div>

                <h3>Crie rotinas <span>personalizadas</span></h3>
            </div>

            <p class="description">
                Uma rotina de estudos feita para você.
                Suas preferências, suas dificuldades, seu ritmo.
            </p>

            <p class="register-text">
                Para aproveitar nossos serviços entre ou faça seu cadastro.
            </p>

        <!-- Botões para a entrada no sistema -->

            <div class="buttons">
                <a href="telaCadastro.html" class="button primary">Criar conta</a>
                <a href="telaLogin.html" class="button secondary">Entrar</a>
            </div>

        </section>

    </main>

    <!-- Rodapé -->
    <footer class="footer">

        <button class="footer-icon" aria-label="Calendário">
            <svg viewBox="0 0 24 24" fill="none">
                <rect x="3" y="4" width="18" height="17"
                    rx="2" stroke="#555" stroke-width="1.8"/>
                <path d="M3 9H21" stroke="#555" stroke-width="1.8"/>
                <path d="M8 2V6M16 2V6"
                    stroke="#555" stroke-width="1.8"
                    stroke-linecap="round"/>
                <path d="M7 12H9M12 12H14M17 12H18
                    M7 16H9M12 16H14M17 16H18"
                    stroke="#555" stroke-width="1.5"
                    stroke-linecap="round"/>
            </svg>
        </button>

         <!-- Logo do StudyFlow (vou deixar os emotes do chat como placeholder enquanto a gente não tem o logo bonitinho) -->

        <div class="footer-logo">
            <div class="brain-icon">🧠</div>
            <div class="book-icon">📖</div>
            <h2>StudyFlow</h2>
            <p>PLANEJE. ESTUDE. EVOLUA.</p>
        </div>

        <button class="footer-icon" aria-label="Biblioteca">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 3H10C11.1 3 12 4 12 5V21
                    C12 19.8 11 19 9.5 19H4V3Z"
                    stroke="#555" stroke-width="1.8"
                    stroke-linejoin="round"/>
                <path d="M20 3H14C12.9 3 12 4 12 5V21
                    C12 19.8 13 19 14.5 19H20V3Z"
                    stroke="#555" stroke-width="1.8"
                    stroke-linejoin="round"/>
            </svg>
        </button>

    </footer>

</body>
</html>
